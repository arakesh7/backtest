[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backtester"
version = "0.1.0"
description = "Institutional Event-Driven Backtesting Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "memory-profiler>=0.61.0",
    "pandas>=2.3.2",
    "requests>=2.32.4",
    "ta-lib>=0.6.7",
    "tabulate>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]
